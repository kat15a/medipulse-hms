<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Records | MediPulse Hospital Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="appHeader"></header>

      <div class="app-content">
        
        <!-- Controls Bar -->
        <div class="card-custom mb-4">
          <div class="card-body-custom">
            <div class="row g-3 align-items-center justify-content-between">
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text bg-transparent text-muted"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="recordSearch" placeholder="Search patient, doctor, diagnosis...">
                </div>
              </div>
              <div class="col-md-6 text-md-end">
                <button class="btn btn-primary rounded-3 px-3 fw-bold d-flex align-items-center gap-2 ms-auto" data-bs-toggle="modal" data-bs-target="#recordModal" onclick="openCreateRecordModal()">
                  <i class="bi bi-journal-plus fs-5"></i>
                  <span>New Medical Record</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Medical Records Table -->
        <div class="card-custom">
          <div class="card-header-custom">
            <h2 class="card-title-custom">
              <i class="bi bi-journal-medical text-primary"></i>
              <span>Patient Medical History & Electronic Health Records</span>
            </h2>
          </div>
          <div class="card-body-custom p-0">
            <div class="table-custom-wrapper border-0">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Record ID</th>
                    <th>Patient Name</th>
                    <th>Attending Doctor</th>
                    <th>Date</th>
                    <th>Diagnosis</th>
                    <th>Vital Signs (BP / HR)</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="recordsTableBody">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Create Record Modal -->
  <div class="modal fade" id="recordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold"><i class="bi bi-journal-plus text-primary me-2"></i>Create Medical Health Record</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="recordForm" novalidate>
          <div class="modal-body py-4">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="recPatient" class="form-label">Patient Name *</label>
                <select class="form-select" id="recPatient" required></select>
              </div>
              <div class="col-md-6">
                <label for="recDoctor" class="form-label">Doctor Name *</label>
                <select class="form-select" id="recDoctor" required></select>
              </div>
              <div class="col-12">
                <label for="recDiagnosis" class="form-label">Clinical Diagnosis *</label>
                <input type="text" class="form-control" id="recDiagnosis" placeholder="e.g. Type-2 Diabetes Mellitus" required>
              </div>

              <!-- Vitals -->
              <div class="col-md-4">
                <label for="recBP" class="form-label">Blood Pressure (mmHg)</label>
                <input type="text" class="form-control" id="recBP" placeholder="120/80">
              </div>
              <div class="col-md-4">
                <label for="recHR" class="form-label">Heart Rate (bpm)</label>
                <input type="text" class="form-control" id="recHR" placeholder="72">
              </div>
              <div class="col-md-4">
                <label for="recTemp" class="form-label">Body Temp (°F)</label>
                <input type="text" class="form-control" id="recTemp" placeholder="98.6">
              </div>

              <div class="col-12">
                <label for="recTreatment" class="form-label">Treatment Plan / Therapy</label>
                <textarea class="form-control" id="recTreatment" rows="2" placeholder="Prescribed medication schedule, physical therapy regimen..."></textarea>
              </div>
              <div class="col-12">
                <label for="recNotes" class="form-label">Physician Progress Notes</label>
                <textarea class="form-control" id="recNotes" rows="2" placeholder="Patient reports symptom improvement since last visit..."></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-3 px-4 fw-bold">Save Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Record Details Modal -->
  <div class="modal fade" id="viewRecordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold"><i class="bi bi-file-earmark-medical text-primary me-2"></i>Medical Record Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="viewRecordModalBody">
          <!-- Populated by JS -->
        </div>
        <div class="modal-footer border-top d-flex justify-content-between align-items-center">
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-primary rounded-3 fw-semibold" onclick="downloadDocument('viewRecordModalBody', 'MediPulse_MedicalRecord')"><i class="bi bi-download me-1"></i> Download Record (PDF)</button>
            <button type="button" class="btn btn-outline-primary rounded-3 fw-semibold" onclick="printDocument('viewRecordModalBody', 'MediPulse Medical Record')"><i class="bi bi-printer me-1"></i> Print Record</button>
          </div>
          <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Custom JS -->
  <script type="module" src="/static/js/firebase-init.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/medicalrecord.js"></script>
</body>
</html>
