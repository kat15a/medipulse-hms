<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients | MediPulse Hospital Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="appHeader"></header>

      <div class="app-content">
        
        <!-- Patients Header Action Bar -->
        <div class="card-custom mb-4">
          <div class="card-body-custom">
            <div class="row g-3 align-items-center justify-content-between">
              <div class="col-md-6 col-lg-5">
                <div class="input-group">
                  <span class="input-group-text bg-transparent text-muted"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="patientSearchInput" placeholder="Search patients by name, email, phone...">
                </div>
              </div>
              <div class="col-md-6 col-lg-4 text-md-end d-flex gap-2 justify-content-md-end">
                <select class="form-select w-auto" id="genderFilter">
                  <option value="">All Genders</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
                <button class="btn btn-primary rounded-3 px-3 fw-bold d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#patientModal" onclick="openAddPatientModal()">
                  <i class="bi bi-person-plus-fill fs-5"></i>
                  <span>Add New Patient</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Patients Table Card -->
        <div class="card-custom">
          <div class="card-header-custom">
            <h2 class="card-title-custom">
              <i class="bi bi-people-fill text-primary"></i>
              <span>Patient Directory</span>
            </h2>
            <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-1" id="patientCountBadge">0 Total</span>
          </div>
          <div class="card-body-custom p-0">
            <div class="table-custom-wrapper border-0">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Patient ID</th>
                    <th>Full Name</th>
                    <th>Age / Gender</th>
                    <th>Contact Phone</th>
                    <th>Email Address</th>
                    <th>Blood Group</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="patientsTableBody">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>
          <div class="p-3 border-top d-flex align-items-center justify-content-between">
            <span class="text-muted small" id="paginationInfo">Showing 1 to 5 of 5 entries</span>
            <ul class="pagination pagination-sm mb-0">
              <li class="page-item disabled"><a class="page-link" href="#">Prev</a></li>
              <li class="page-item active"><a class="page-link" href="#">1</a></li>
              <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add / Edit Patient Modal -->
  <div class="modal fade" id="patientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="patientModalTitle"><i class="bi bi-person-plus me-2 text-primary"></i>Add Patient Record</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="patientForm" novalidate>
          <div class="modal-body py-4">
            <input type="hidden" id="patientId">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="pName" class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="pName" placeholder="e.g. Eleanor Vance" required>
              </div>
              <div class="col-md-3">
                <label for="pAge" class="form-label">Age *</label>
                <input type="number" class="form-control" id="pAge" placeholder="34" min="0" max="120" required>
              </div>
              <div class="col-md-3">
                <label for="pGender" class="form-label">Gender *</label>
                <select class="form-select" id="pGender" required>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="pPhone" class="form-label">Phone Number *</label>
                <input type="text" class="form-control" id="pPhone" placeholder="+91 98765 00000" required>
              </div>
              <div class="col-md-6">
                <label for="pEmail" class="form-label">Email Address *</label>
                <input type="email" class="form-control" id="pEmail" placeholder="eleanor@example.com" required>
              </div>
              <div class="col-md-4">
                <label for="pBlood" class="form-label">Blood Group</label>
                <select class="form-select" id="pBlood">
                  <option value="A+">A+</option>
                  <option value="A-">A-</option>
                  <option value="B+">B+</option>
                  <option value="B-">B-</option>
                  <option value="O+" selected>O+</option>
                  <option value="O-">O-</option>
                  <option value="AB+">AB+</option>
                  <option value="AB-">AB-</option>
                </select>
              </div>
              <div class="col-md-8">
                <label for="pAddress" class="form-label">Home Address</label>
                <input type="text" class="form-control" id="pAddress" placeholder="742 Evergreen Terrace, City">
              </div>
              <div class="col-12">
                <label for="pHistory" class="form-label">Medical History & Allergies</label>
                <textarea class="form-control" id="pHistory" rows="3" placeholder="Notes on pre-existing conditions, chronic ailments, penicillin allergies..."></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-3 px-4 fw-bold" id="savePatientBtn">Save Patient Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Details Modal -->
  <div class="modal fade" id="viewPatientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom bg-light">
          <h5 class="modal-title fw-bold"><i class="bi bi-card-heading text-primary me-2"></i>Patient Full Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="viewPatientModalBody">
          <!-- Populated by JS -->
        </div>
        <div class="modal-footer border-top">
          <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script type="module" src="/static/js/firebase-init.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/patient.js"></script>
</body>
</html>
