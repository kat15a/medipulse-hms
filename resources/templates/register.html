<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MediPulse Hospital Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Style -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <i class="bi bi-hospital"></i>
        </div>
        <h1 class="auth-brand-text">Medi<span>Pulse</span></h1>
      </div>

      <div class="text-center mb-4">
        <h2 class="h5 fw-bold text-dark dark:text-light mb-1">Create Account</h2>
        <p class="text-muted small">Register for new hospital account & access</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="row g-3">
          <!-- Username -->
          <div class="col-12">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent text-muted"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="username" placeholder="e.g. dr_arthur" required>
            </div>
            <div class="invalid-feedback">Please enter a unique username.</div>
          </div>

          <!-- Email -->
          <div class="col-12">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="name@medipulse.com" required>
            </div>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <!-- Role Dropdown -->
          <div class="col-12">
            <label for="role" class="form-label">Account Role</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent text-muted"><i class="bi bi-shield-person"></i></span>
              <select class="form-select" id="role" required>
                <option value="" disabled selected>Select Role...</option>
                <option value="PATIENT">Patient Account</option>
                <option value="DOCTOR">Doctor Account</option>
                <option value="ADMIN">System Administrator</option>
              </select>
            </div>
            <div class="invalid-feedback">Please select a role.</div>
          </div>

          <!-- Password -->
          <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="6">
            <div class="invalid-feedback">Min 6 characters required.</div>
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>
        </div>

        <div class="form-check my-3">
          <input class="form-check-input" type="checkbox" id="termsCheck" required>
          <label class="form-check-label text-muted small" for="termsCheck">
            I agree to the <a href="#" class="text-primary">Terms of Service</a> & HIPAA Privacy Guidelines.
          </label>
          <div class="invalid-feedback">You must accept terms before registering.</div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold d-flex align-items-center justify-content-center gap-2" id="registerSubmitBtn">
          <span>Complete Registration</span>
          <div class="spinner-border spinner-border-sm d-none" id="registerSpinner" role="status"></div>
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <p class="text-muted small mb-0">Already registered? <a href="/resources/templates/login.html" class="text-primary fw-bold text-decoration-none">Sign in here</a></p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script type="module" src="/static/js/firebase-init.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/register.js"></script>
</body>
</html>
