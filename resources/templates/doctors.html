<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctors | MediPulse Hospital Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="appHeader"></header>

      <div class="app-content">
        
        <!-- Filter & Header Controls -->
        <div class="card-custom mb-4">
          <div class="card-body-custom">
            <div class="row g-3 align-items-center justify-content-between">
              <div class="col-md-5">
                <div class="input-group">
                  <span class="input-group-text bg-transparent text-muted"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="doctorSearchInput" placeholder="Search doctor name, specialty...">
                </div>
              </div>
              <div class="col-md-7 d-flex gap-2 justify-content-md-end align-items-center">
                <select class="form-select w-auto" id="specializationFilter">
                  <option value="">All Specializations</option>
                  <option value="Cardiology">Cardiology</option>
                  <option value="Neurology">Neurology</option>
                  <option value="Orthopedics">Orthopedics</option>
                  <option value="Pediatrics">Pediatrics</option>
                  <option value="Dermatology">Dermatology</option>
                  <option value="General Medicine">General Medicine</option>
                </select>

                <!-- View Mode Switch (Grid vs Table) -->
                <div class="btn-group" role="group">
                  <button type="button" class="btn btn-outline-secondary active" id="btnViewCards" onclick="setViewMode('cards')"><i class="bi bi-grid-fill"></i></button>
                  <button type="button" class="btn btn-outline-secondary" id="btnViewTable" onclick="setViewMode('table')"><i class="bi bi-list-task"></i></button>
                </div>

                <button class="btn btn-primary rounded-3 px-3 fw-bold d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#doctorModal" onclick="openAddDoctorModal()">
                  <i class="bi bi-plus-circle-fill fs-5"></i>
                  <span>Add Doctor</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Doctor Profile Cards Grid Container -->
        <div id="doctorsCardContainer" class="row g-4">
          <!-- Rendered dynamically -->
        </div>

        <!-- Doctor Table Container (Hidden by default) -->
        <div id="doctorsTableContainer" class="card-custom d-none">
          <div class="card-body-custom p-0">
            <div class="table-custom-wrapper border-0">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Doctor Name</th>
                    <th>Specialization</th>
                    <th>Experience</th>
                    <th>Fee (₹)</th>
                    <th>Contact Phone</th>
                    <th>Email</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="doctorsTableBody">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add / Edit Doctor Modal -->
  <div class="modal fade" id="doctorModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="doctorModalTitle"><i class="bi bi-person-badge text-primary me-2"></i>Add Doctor Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="doctorForm" novalidate>
          <div class="modal-body py-4">
            <input type="hidden" id="doctorId">
            <div class="row g-3">
              <div class="col-12">
                <label for="dName" class="form-label">Doctor Full Name *</label>
                <input type="text" class="form-control" id="dName" placeholder="Dr. Arthur Pendelton" required>
              </div>
              <div class="col-md-6">
                <label for="dSpec" class="form-label">Specialization *</label>
                <select class="form-select" id="dSpec" required>
                  <option value="Cardiology">Cardiology</option>
                  <option value="Neurology">Neurology</option>
                  <option value="Orthopedics">Orthopedics</option>
                  <option value="Pediatrics">Pediatrics</option>
                  <option value="Dermatology">Dermatology</option>
                  <option value="General Medicine">General Medicine</option>
                  <option value="Oncology">Oncology</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="dExp" class="form-label">Experience (Years) *</label>
                <input type="text" class="form-control" id="dExp" placeholder="12 Years" required>
              </div>
              <div class="col-md-6">
                <label for="dFee" class="form-label">Consultation Fee (₹) *</label>
                <input type="number" class="form-control" id="dFee" placeholder="500" required>
              </div>
              <div class="col-md-6">
                <label for="dPhone" class="form-label">Phone Number *</label>
                <input type="text" class="form-control" id="dPhone" placeholder="+91 98765 00000" required>
              </div>
              <div class="col-12">
                <label for="dEmail" class="form-label">Email Address *</label>
                <input type="email" class="form-control" id="dEmail" placeholder="doctor@medipulse.com" required>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-3 px-4 fw-bold">Save Doctor Profile</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script type="module" src="/static/js/firebase-init.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/doctor.js"></script>
</body>
</html>
