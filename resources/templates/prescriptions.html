<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prescriptions | MediPulse Hospital Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="appHeader"></header>

      <div class="app-content">
        
        <!-- Controls Bar -->
        <div class="card-custom mb-4">
          <div class="card-body-custom">
            <div class="row g-3 align-items-center justify-content-between">
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text bg-transparent text-muted"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="prescriptionSearch" placeholder="Search by patient, doctor, diagnosis...">
                </div>
              </div>
              <div class="col-md-6 text-md-end">
                <button class="btn btn-primary rounded-3 px-3 fw-bold d-flex align-items-center gap-2 ms-auto" data-bs-toggle="modal" data-bs-target="#prescriptionModal" onclick="openCreatePrescriptionModal()">
                  <i class="bi bi-file-earmark-medical-fill fs-5"></i>
                  <span>Issue New Prescription</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Prescriptions Table -->
        <div class="card-custom">
          <div class="card-header-custom">
            <h2 class="card-title-custom">
              <i class="bi bi-capsule-pill text-primary"></i>
              <span>Prescription Records</span>
            </h2>
            <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-1" id="prescriptionCountBadge">0 Total</span>
          </div>
          <div class="card-body-custom p-0">
            <div class="table-custom-wrapper border-0">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Rx ID</th>
                    <th>Patient Name</th>
                    <th>Doctor Name</th>
                    <th>Diagnosis</th>
                    <th>Issued Date</th>
                    <th>Medicines Prescribed</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="prescriptionsTableBody">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Create Prescription Modal -->
  <div class="modal fade" id="prescriptionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold"><i class="bi bi-file-earmark-medical text-primary me-2"></i>New Prescription Form</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="prescriptionForm" novalidate>
          <div class="modal-body py-4">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="rxPatient" class="form-label">Patient *</label>
                <select class="form-select" id="rxPatient" required></select>
              </div>
              <div class="col-md-6">
                <label for="rxDoctor" class="form-label">Doctor *</label>
                <select class="form-select" id="rxDoctor" required></select>
              </div>
              <div class="col-12">
                <label for="rxDiagnosis" class="form-label">Diagnosis / Condition *</label>
                <input type="text" class="form-control" id="rxDiagnosis" placeholder="e.g. Mild Hypertension & Fatigue" required>
              </div>
            </div>

            <hr class="my-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="fw-bold m-0"><i class="bi bi-capsule me-1 text-primary"></i>Medicines & Dosage Schedule</h6>
              <button type="button" class="btn btn-sm btn-outline-primary rounded-3" onclick="addMedicineRow()"><i class="bi bi-plus"></i> Add Medicine</button>
            </div>

            <div id="medicineRowsContainer" class="d-flex flex-column gap-2 mb-3">
              <!-- Dynamic Rows -->
            </div>

            <div class="col-12">
              <label for="rxInstructions" class="form-label">Doctor's Special Instructions / Dietary Notes</label>
              <textarea class="form-control" id="rxInstructions" rows="2" placeholder="Take after meals, drink plenty of water, avoid strenuous physical exercise..."></textarea>
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-3 px-4 fw-bold">Issue Prescription</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Prescription Rx Format Modal -->
  <div class="modal fade" id="viewPrescriptionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4" id="printableRxModal">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="rxPrintContent">
          <!-- Populated by JS for clean Rx Print preview -->
        </div>
        <div class="modal-footer border-top d-flex justify-content-between align-items-center">
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-primary rounded-3 fw-semibold" onclick="downloadDocument('rxPrintContent', 'MediPulse_Prescription')"><i class="bi bi-download me-1"></i> Download Rx (PDF)</button>
            <button type="button" class="btn btn-outline-primary rounded-3 fw-semibold" onclick="printDocument('rxPrintContent', 'MediPulse Hospital Prescription')"><i class="bi bi-printer me-1"></i> Print Prescription</button>
          </div>
          <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Custom JS -->
  <script type="module" src="/static/js/firebase-init.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/prescription.js"></script>
</body>
</html>
