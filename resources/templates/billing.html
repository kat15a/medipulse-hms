<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing & Invoices | MediPulse Hospital Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="appHeader"></header>

      <div class="app-content">
        
        <!-- Metrics Row -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card-custom p-3 d-flex align-items-center gap-3">
              <div class="user-avatar bg-success-subtle text-success" style="width:48px; height:48px; font-size:1.4rem;">
                <i class="bi bi-cash-stack"></i>
              </div>
              <div>
                <span class="text-muted small fw-semibold uppercase">Total Revenue Collected</span>
                <h4 class="fw-bold mb-0 text-success" id="billTotalCollected">₹4,050</h4>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card-custom p-3 d-flex align-items-center gap-3">
              <div class="user-avatar bg-warning-subtle text-warning" style="width:48px; height:48px; font-size:1.4rem;">
                <i class="bi bi-clock-history"></i>
              </div>
              <div>
                <span class="text-muted small fw-semibold uppercase">Pending Accounts Receivable</span>
                <h4 class="fw-bold mb-0 text-warning" id="billTotalPending">₹1,240</h4>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card-custom p-3 d-flex align-items-center gap-3">
              <div class="user-avatar bg-primary-subtle text-primary" style="width:48px; height:48px; font-size:1.4rem;">
                <i class="bi bi-receipt"></i>
              </div>
              <div>
                <span class="text-muted small fw-semibold uppercase">Total Invoices Issued</span>
                <h4 class="fw-bold mb-0 text-primary" id="billTotalInvoices">3</h4>
              </div>
            </div>
          </div>
        </div>

        <!-- Controls Bar -->
        <div class="card-custom mb-4">
          <div class="card-body-custom">
            <div class="row g-3 align-items-center justify-content-between">
              <div class="col-md-5">
                <div class="input-group">
                  <span class="input-group-text bg-transparent text-muted"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="billSearch" placeholder="Search patient, invoice no...">
                </div>
              </div>
              <div class="col-md-7 d-flex gap-2 justify-content-md-end">
                <select class="form-select w-auto" id="billStatusFilter">
                  <option value="">All Statuses</option>
                  <option value="PAID">PAID</option>
                  <option value="PENDING">PENDING</option>
                </select>
                <button class="btn btn-primary rounded-3 px-3 fw-bold d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#billModal" onclick="openGenerateBillModal()">
                  <i class="bi bi-plus-circle-fill fs-5"></i>
                  <span>Generate New Invoice</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Billing Table -->
        <div class="card-custom">
          <div class="card-header-custom">
            <h2 class="card-title-custom">
              <i class="bi bi-receipt-cutoff text-primary"></i>
              <span>Patient Invoices & Payment Ledger</span>
            </h2>
          </div>
          <div class="card-body-custom p-0">
            <div class="table-custom-wrapper border-0">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Invoice No</th>
                    <th>Patient Name</th>
                    <th>Date</th>
                    <th>Consultation (₹)</th>
                    <th>Lab/Medicine (₹)</th>
                    <th>Total Amount (₹)</th>
                    <th>Payment Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="billingTableBody">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Generate Bill Modal -->
  <div class="modal fade" id="billModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold"><i class="bi bi-receipt text-primary me-2"></i>Generate Hospital Invoice</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="billForm" novalidate>
          <div class="modal-body py-4">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="billPatient" class="form-label">Patient Name *</label>
                <select class="form-select" id="billPatient" required></select>
              </div>
              <div class="col-md-6">
                <label for="billPayStatus" class="form-label">Payment Status *</label>
                <select class="form-select" id="billPayStatus" required>
                  <option value="PAID">PAID</option>
                  <option value="PENDING" selected>PENDING</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="billConsultFee" class="form-label">Consultation Fee (₹)</label>
                <input type="number" class="form-control bill-calc" id="billConsultFee" value="500" required>
              </div>
              <div class="col-md-4">
                <label for="billLabFee" class="form-label">Lab Test Fee (₹)</label>
                <input type="number" class="form-control bill-calc" id="billLabFee" value="300">
              </div>
              <div class="col-md-4">
                <label for="billMedFee" class="form-label">Pharmacy Medicine Fee (₹)</label>
                <input type="number" class="form-control bill-calc" id="billMedFee" value="250">
              </div>
              <div class="col-md-6">
                <label for="billTax" class="form-label">Tax / Service Charge (₹)</label>
                <input type="number" class="form-control bill-calc" id="billTax" value="150">
              </div>
              <div class="col-md-6">
                <label for="billPayMethod" class="form-label">Payment Method</label>
                <select class="form-select" id="billPayMethod">
                  <option value="UPI / GPay / PhonePe">UPI / GPay / PhonePe</option>
                  <option value="Credit / Debit Card">Credit / Debit Card</option>
                  <option value="Cash">Cash</option>
                  <option value="Insurance Claim">Insurance Claim</option>
                  <option value="Pending">Pending Payment</option>
                </select>
              </div>

              <div class="col-12 mt-4 p-3 bg-light rounded-3 d-flex justify-content-between align-items-center">
                <span class="fw-bold fs-6">Grand Total Amount Due:</span>
                <span class="fs-4 fw-extrabold text-primary" id="billTotalCalculated">₹1,200</span>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-3 px-4 fw-bold">Generate Invoice</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Invoice Modal -->
  <div class="modal fade" id="viewInvoiceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="invoiceModalContent">
          <!-- Populated by JS -->
        </div>
        <div class="modal-footer border-top d-flex justify-content-between align-items-center">
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-primary rounded-3 fw-semibold" onclick="downloadDocument('invoiceModalContent', 'MediPulse_Invoice')"><i class="bi bi-download me-1"></i> Download Invoice (PDF)</button>
            <button type="button" class="btn btn-outline-primary rounded-3 fw-semibold" onclick="printDocument('invoiceModalContent', 'MediPulse Hospital Invoice')"><i class="bi bi-printer me-1"></i> Print Invoice</button>
          </div>
          <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Custom JS -->
  <script type="module" src="/static/js/firebase-init.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/billing.js"></script>
</body>
</html>
