<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments | MediPulse Hospital Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="appHeader"></header>

      <div class="app-content">
        
        <!-- Controls Bar -->
        <div class="card-custom mb-4">
          <div class="card-body-custom">
            <div class="row g-3 align-items-center justify-content-between">
              <div class="col-md-5">
                <div class="input-group">
                  <span class="input-group-text bg-transparent text-muted"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="appointmentSearch" placeholder="Search patient name, doctor, reason...">
                </div>
              </div>
              <div class="col-md-7 d-flex gap-2 justify-content-md-end">
                <select class="form-select w-auto" id="statusFilter" style="min-width: 150px;">
                  <option value="">All Statuses</option>
                  <option value="Scheduled">Scheduled</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
                <button class="btn btn-primary rounded-3 px-3 fw-bold d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#appointmentModal" onclick="openScheduleModal()">
                  <i class="bi bi-calendar-plus-fill fs-5"></i>
                  <span>Schedule Appointment</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Appointments Table -->
        <div class="card-custom">
          <div class="card-header-custom">
            <h2 class="card-title-custom">
              <i class="bi bi-calendar2-check-fill text-primary"></i>
              <span>Appointments Schedule</span>
            </h2>
            <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-1" id="appointmentCountBadge">0 Total</span>
          </div>
          <div class="card-body-custom p-0">
            <div class="table-custom-wrapper border-0">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Appt ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Date & Time</th>
                    <th>Department</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="appointmentsTableBody">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Schedule / Edit Appointment Modal -->
  <div class="modal fade" id="appointmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="appointmentModalTitle"><i class="bi bi-calendar-plus text-primary me-2"></i>Schedule Appointment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="appointmentForm" novalidate>
          <div class="modal-body py-4">
            <input type="hidden" id="appointmentId">
            <div class="row g-3">
              <div class="col-12">
                <label for="appPatientSelect" class="form-label">Select Patient *</label>
                <select class="form-select" id="appPatientSelect" required>
                  <!-- Populated from patients API -->
                </select>
              </div>
              <div class="col-12">
                <label for="appDoctorSelect" class="form-label">Select Doctor *</label>
                <select class="form-select" id="appDoctorSelect" required>
                  <!-- Populated from doctors API -->
                </select>
              </div>
              <div class="col-md-6">
                <label for="appDate" class="form-label">Appointment Date *</label>
                <input type="date" class="form-control" id="appDate" required>
              </div>
              <div class="col-md-6">
                <label for="appTime" class="form-label">Time Slot *</label>
                <select class="form-select" id="appTime" required>
                  <option value="09:00 AM">09:00 AM</option>
                  <option value="10:30 AM" selected>10:30 AM</option>
                  <option value="11:45 AM">11:45 AM</option>
                  <option value="02:00 PM">02:00 PM</option>
                  <option value="03:30 PM">03:30 PM</option>
                  <option value="05:00 PM">05:00 PM</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="appDepartment" class="form-label">Department</label>
                <input type="text" class="form-control" id="appDepartment" placeholder="e.g. Cardiology" readonly>
              </div>
              <div class="col-md-6">
                <label for="appStatus" class="form-label">Status *</label>
                <select class="form-select" id="appStatus" required>
                  <option value="Scheduled">Scheduled</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Completed">Completed</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>
              <div class="col-12">
                <label for="appReason" class="form-label">Reason for Visit / Symptoms</label>
                <textarea class="form-control" id="appReason" rows="2" placeholder="Describe symptoms or routine checkup goals..."></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light rounded-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-3 px-4 fw-bold">Save Appointment</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script type="module" src="/static/js/firebase-init.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/appointment.js"></script>
</body>
</html>
