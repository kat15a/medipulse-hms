<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | MediPulse Hospital Management System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <div class="app-layout">
    <aside class="app-sidebar" id="appSidebar"></aside>

    <main class="app-main">
      <header class="app-header" id="appHeader"></header>

      <div class="app-content">
        
        <div class="row g-4">
          <!-- Profile Sidebar Card -->
          <div class="col-lg-4">
            <div class="card-custom text-center p-4">
              <div class="user-avatar mx-auto mb-3" style="width: 84px; height: 84px; font-size: 2.2rem; background: #2563eb; color: #fff;" id="profileAvatar">
                A
              </div>
              <h4 class="fw-bold mb-1" id="profileFullNameDisplay">Admin User</h4>
              <p class="text-muted small mb-2" id="profileEmailDisplay">admin@medipulse.com</p>
              <span class="badge bg-primary-subtle text-primary px-3 py-1 rounded-pill uppercase fw-bold" id="profileRoleBadge">ADMIN</span>

              <hr class="my-4">
              <div class="text-start space-y-3 small">
                <div class="d-flex justify-content-between"><span class="text-muted">Account Status:</span> <span class="fw-bold text-success">Active / Verified</span></div>
                <div class="d-flex justify-content-between"><span class="text-muted">Security Level:</span> <span class="fw-bold text-primary">JWT Token Auth</span></div>
                <div class="d-flex justify-content-between"><span class="text-muted">Last Login:</span> <span class="text-muted">Today, 10:19 AM</span></div>
              </div>

              <button class="btn btn-outline-danger w-100 rounded-3 mt-4 fw-bold" onclick="handleLogout(event)"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</button>
            </div>
          </div>

          <!-- Forms Column -->
          <div class="col-lg-8 space-y-4">
            <!-- Edit Profile Form -->
            <div class="card-custom">
              <div class="card-header-custom">
                <h2 class="card-title-custom">
                  <i class="bi bi-person-gear text-primary"></i>
                  <span>Update Profile Information</span>
                </h2>
              </div>
              <div class="card-body-custom">
                <form id="profileForm" novalidate>
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label for="profUsername" class="form-label">Username</label>
                      <input type="text" class="form-control" id="profUsername" required>
                    </div>
                    <div class="col-md-6">
                      <label for="profEmail" class="form-label">Email Address</label>
                      <input type="email" class="form-control" id="profEmail" required>
                    </div>
                    <div class="col-12">
                      <label for="profFullName" class="form-label">Display Name</label>
                      <input type="text" class="form-control" id="profFullName" required>
                    </div>
                  </div>
                  <button type="submit" class="btn btn-primary rounded-3 px-4 fw-bold mt-3">Save Profile Changes</button>
                </form>
              </div>
            </div>

            <!-- Change Password Form -->
            <div class="card-custom">
              <div class="card-header-custom">
                <h2 class="card-title-custom">
                  <i class="bi bi-shield-lock text-warning"></i>
                  <span>Change Account Password</span>
                </h2>
              </div>
              <div class="card-body-custom">
                <form id="passwordForm" novalidate>
                  <div class="row g-3">
                    <div class="col-12">
                      <label for="currPass" class="form-label">Current Password</label>
                      <input type="password" class="form-control" id="currPass" required>
                    </div>
                    <div class="col-md-6">
                      <label for="newPass" class="form-label">New Password</label>
                      <input type="password" class="form-control" id="newPass" required minlength="6">
                    </div>
                    <div class="col-md-6">
                      <label for="confNewPass" class="form-label">Confirm New Password</label>
                      <input type="password" class="form-control" id="confNewPass" required>
                    </div>
                  </div>
                  <button type="submit" class="btn btn-warning rounded-3 px-4 fw-bold mt-3 text-dark">Update Password</button>
                </form>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script type="module" src="/static/js/firebase-init.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/profile.js"></script>
</body>
</html>
